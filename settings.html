<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки — Планировщик подарков</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">🎁 Планировщик подарков</h1>
            <nav class="nav">
                <a href="index.html" class="nav-link">Главная</a>
                <a href="my-lists.html" class="nav-link">Мои списки</a>
                <a href="gift-ideas.html" class="nav-link">Идеи подарков</a>
                <a href="settings.html" class="nav-link active">Настройки</a>
            </nav>
        </div>
    </header>
    <main class="main">
        <div class="container">
            <section class="page-header">
                <h2>Настройки приложения</h2>
            </section>
            <div style="background:white; border-radius:15px; padding:25px; max-width:500px; margin:0 auto;">
                <label style="display:block; margin-bottom:15px;">
                    <strong>Валюта по умолчанию</strong><br>
                    <select id="currencySelect" style="padding:8px; border-radius:8px; width:100%;">
                        <option value="₽">Рубль (₽)</option>
                        <option value="$">Доллар ($)</option>
                        <option value="€">Евро (€)</option>
                    </select>
                </label>
                <label style="display:block; margin-bottom:15px;">
                    <strong>Напоминать за дни до события</strong><br>
                    <input type="number" id="reminderDays" min="1" max="30" value="7" style="padding:8px; border-radius:8px; width:100%;">
                </label>
                <button class="btn btn-primary" onclick="saveSettings()" style="width:100%;">Сохранить настройки</button>
                <p id="saveMsg" style="margin-top:15px; text-align:center; color:green;"></p>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p style="text-align:center; padding:20px;">Шкибиди доп доп доп ес ес</p>
        </div>
    </footer>
    <script src="settings.js"></script>
    <script>
        function loadSettingsToForm() {
            document.getElementById('currencySelect').value = localStorage.getItem('currency') || '₽';
            document.getElementById('reminderDays').value = localStorage.getItem('reminderDays') || 7;
        }
        function saveSettings() {
            localStorage.setItem('currency', document.getElementById('currencySelect').value);
            localStorage.setItem('reminderDays', document.getElementById('reminderDays').value);
            document.getElementById('saveMsg').innerText = '✅ Настройки сохранены! Они применятся на всех страницах.';
            setTimeout(() => document.getElementById('saveMsg').innerText = '', 3000);
        }
        loadSettingsToForm();
    </script>
</body>
</html>
